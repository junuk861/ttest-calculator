<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANOVA Calculator</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jstat/1.9.6/jstat.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #667085;
      --line: #d8dee8;
      --accent: #276ef1;
      --accent-dark: #174ea6;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(1060px, calc(100% - 32px));
      margin: 28px auto 48px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      margin-bottom: 4px;
      font-size: clamp(1.7rem, 3vw, 2.3rem);
    }

    .nav-link {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(360px, 1.1fr);
      gap: 20px;
      align-items: start;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 10px 24px rgba(20, 30, 45, 0.05);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 74px;
      margin-bottom: 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      color: var(--ink);
      font: inherit;
      resize: vertical;
    }

    button {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    button:hover { background: var(--accent-dark); }

    .message {
      display: none;
      margin-bottom: 16px;
      border: 1px solid #f5c2c0;
      border-radius: 6px;
      padding: 10px 12px;
      background: #fff3f2;
      color: var(--danger);
      font-weight: 700;
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0 20px;
    }

    .result-table th,
    .result-table td {
      border-bottom: 1px solid var(--line);
      padding: 10px 8px;
      text-align: left;
      vertical-align: top;
    }

    .result-table th {
      color: var(--muted);
      font-size: 0.86rem;
      text-transform: uppercase;
    }

    .stars {
      display: inline-block;
      min-width: 42px;
      color: var(--accent-dark);
      font-weight: 800;
    }

    .chart-wrap {
      height: 330px;
      margin-top: 18px;
    }

    .empty {
      color: var(--muted);
      margin-bottom: 0;
    }

    @media (max-width: 820px) {
      header,
      .grid {
        display: block;
      }

      .nav-link {
        display: inline-block;
        margin-top: 8px;
      }

      section {
        margin-bottom: 16px;
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div>
        <h1>One-way ANOVA</h1>
        <p class="empty">One-way ANOVA with Bonferroni-corrected Welch pairwise comparisons.</p>
      </div>
      <a class="nav-link" href="index.html">Open t-test Calculator</a>
    </header>

    <div class="grid">
      <section>
        <h2>Input</h2>

        <div id="message" class="message"></div>

        <label for="g1">Group 1</label>
        <textarea id="g1" placeholder="Example: 4.2, 5.1, 5.5, 6.0"></textarea>

        <label for="g2">Group 2</label>
        <textarea id="g2" placeholder="Example: 3.8, 4.0, 4.4, 5.2"></textarea>

        <label for="g3">Group 3</label>
        <textarea id="g3" placeholder="Example: 6.1, 6.4, 7.0, 7.3"></textarea>

        <label for="g4">Group 4</label>
        <textarea id="g4" placeholder="Optional"></textarea>

        <button onclick="runANOVA()">Calculate</button>
      </section>

      <section>
        <h2>Result</h2>
        <div id="result">
          <p class="empty">Enter at least two groups and calculate to see the summary.</p>
        </div>

        <div class="chart-wrap">
          <canvas id="plot"></canvas>
        </div>
      </section>
    </div>
  </main>

  <script>
    function parseInput(str) {
      return str
        .split(/[\s,;]+/)
        .map(x => parseFloat(x.trim()))
        .filter(x => Number.isFinite(x));
    }

    function mean(a) {
      return a.reduce((x, y) => x + y, 0) / a.length;
    }

    function variance(a, m) {
      return a.reduce((x, y) => x + (y - m) ** 2, 0) / (a.length - 1);
    }

    function sem(a) {
      return Math.sqrt(variance(a, mean(a)) / a.length);
    }

    function showMessage(text) {
      const message = document.getElementById("message");
      message.textContent = text;
      message.style.display = text ? "block" : "none";
    }

    function starsForP(p) {
      if (p < 0.001) return "***";
      if (p < 0.01) return "**";
      if (p < 0.05) return "*";
      return "ns";
    }

    function formatP(p) {
      return p < 0.001 ? p.toExponential(3) : p.toFixed(4);
    }

    function collectGroups() {
      return ["g1", "g2", "g3", "g4"]
        .map((id, index) => ({
          name: `Group ${index + 1}`,
          values: parseInput(document.getElementById(id).value)
        }))
        .filter(group => group.values.length > 0);
    }

    function runANOVA() {
      showMessage("");

      const groups = collectGroups();

      if (groups.length < 2) {
        showMessage("Enter at least two groups.");
        return;
      }

      const tooSmall = groups.find(group => group.values.length < 2);
      if (tooSmall) {
        showMessage(`${tooSmall.name} needs at least 2 numeric values.`);
        return;
      }

      const k = groups.length;
      const all = groups.flatMap(group => group.values);
      const grandMean = mean(all);

      let ssBetween = 0;
      let ssWithin = 0;

      groups.forEach(group => {
        const m = mean(group.values);
        ssBetween += group.values.length * (m - grandMean) ** 2;

        group.values.forEach(x => {
          ssWithin += (x - m) ** 2;
        });
      });

      const totalN = all.length;
      const dfBetween = k - 1;
      const dfWithin = totalN - k;
      const msBetween = ssBetween / dfBetween;
      const msWithin = ssWithin / dfWithin;
      const F = msBetween / msWithin;

      if (!Number.isFinite(F) || dfWithin <= 0) {
        showMessage("ANOVA could not be calculated. Check for identical values or too little variation.");
        return;
      }

      const p = Math.min(Math.max(1 - jStat.centralF.cdf(F, dfBetween, dfWithin), 0), 1);
      const comparisons = k * (k - 1) / 2;

      let groupRows = groups.map(group => {
        const m = mean(group.values);
        return `
          <tr>
            <td>${group.name}</td>
            <td>${m.toFixed(3)} &plusmn; ${sem(group.values).toFixed(3)} SEM</td>
            <td>${group.values.length}</td>
          </tr>
        `;
      }).join("");

      let posthocRows = "";

      for (let i = 0; i < k; i++) {
        for (let j = i + 1; j < k; j++) {
          const a = groups[i];
          const b = groups[j];
          const m1 = mean(a.values);
          const m2 = mean(b.values);
          const v1 = variance(a.values, m1);
          const v2 = variance(b.values, m2);
          const se2 = v1 / a.values.length + v2 / b.values.length;
          const t = (m1 - m2) / Math.sqrt(se2);
          const df = se2 ** 2 / (((v1 / a.values.length) ** 2 / (a.values.length - 1)) + ((v2 / b.values.length) ** 2 / (b.values.length - 1)));

          if (!Number.isFinite(t) || !Number.isFinite(df) || df <= 0) {
            posthocRows += `<tr><td>${a.name} vs ${b.name}</td><td colspan="3">Could not calculate</td></tr>`;
            continue;
          }

          const pRaw = Math.min(Math.max(2 * (1 - jStat.studentt.cdf(Math.abs(t), df)), 0), 1);
          const pAdj = Math.min(pRaw * comparisons, 1);
          const stars = starsForP(pAdj);

          posthocRows += `
            <tr>
              <td>${a.name} vs ${b.name}</td>
              <td>${t.toFixed(3)}</td>
              <td>${df.toFixed(2)}</td>
              <td>${formatP(pAdj)} <span class="stars">${stars}</span></td>
            </tr>
          `;
        }
      }

      document.getElementById("result").innerHTML = `
        <table class="result-table">
          <tr><th>ANOVA</th><th>Value</th></tr>
          <tr><td>F(${dfBetween}, ${dfWithin})</td><td>${F.toFixed(3)}</td></tr>
          <tr><td>p</td><td>${formatP(p)} <span class="stars">${starsForP(p)}</span></td></tr>
        </table>

        <h3>Group Summary</h3>
        <table class="result-table">
          <tr><th>Group</th><th>Mean</th><th>n</th></tr>
          ${groupRows}
        </table>

        <h3>Post Hoc Bonferroni</h3>
        <table class="result-table">
          <tr><th>Comparison</th><th>t</th><th>df</th><th>Adjusted p</th></tr>
          ${posthocRows}
        </table>
      `;

      drawPlot(groups);
    }

    function jitter(index) {
      return ((index % 5) - 2) * 0.04;
    }

    function drawPlot(groups) {
      const ctx = document.getElementById("plot").getContext("2d");
      const colors = ["#276ef1", "#d92d20", "#039855", "#7a5af8"];

      if (window.chart) window.chart.destroy();

      const valueSets = groups.map((group, groupIndex) => ({
        label: `${group.name} values`,
        data: group.values.map((y, i) => ({ x: groupIndex + 1 + jitter(i), y })),
        backgroundColor: colors[groupIndex % colors.length]
      }));

      const meanSet = {
        label: "Group means",
        data: groups.map((group, index) => ({ x: index + 1, y: mean(group.values) })),
        type: "line",
        borderColor: "#17202a",
        backgroundColor: "#17202a",
        pointRadius: 7,
        pointStyle: "rectRounded",
        showLine: false
      };

      window.chart = new Chart(ctx, {
        type: "scatter",
        data: {
          datasets: [...valueSets, meanSet]
        },
        options: {
          maintainAspectRatio: false,
          plugins: {
            legend: { position: "bottom" }
          },
          scales: {
            x: {
              min: 0.5,
              max: groups.length + 0.5,
              ticks: {
                stepSize: 1,
                callback: value => Number.isInteger(value) && groups[value - 1] ? groups[value - 1].name : ""
              }
            },
            y: {
              title: { display: true, text: "Value" }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
