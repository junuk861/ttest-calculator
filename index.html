<!DOCTYPE html>
<html>
<head>
  <title>Advanced t-test Calculator</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jstat/1.9.6/jstat.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
<h2>Advanced t-test Calculator</h2>

<h3>Input</h3>
<textarea id="g1" rows="3" cols="40"></textarea><br>
<textarea id="g2" rows="3" cols="40"></textarea><br><br>

<select id="testType">
  <option value="welch">Unpaired (Welch)</option>
  <option value="student">Unpaired (Equal variance)</option>
</select>

<br><br>
<button onclick="runTest()">Calculate</button>

<h3>Result</h3>
<div id="result"></div>

<script>
function parseInput(str){
  return str.split(',').map(x=>parseFloat(x.trim())).filter(x=>!isNaN(x));
}

function mean(a){ return a.reduce((x,y)=>x+y,0)/a.length; }

function variance(a,m){
  return a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1);
}

function runTest(){
  let g1 = parseInput(document.getElementById("g1").value);
  let g2 = parseInput(document.getElementById("g2").value);

  let m1 = mean(g1), m2 = mean(g2);
  let v1 = variance(g1,m1), v2 = variance(g2,m2);

  let t = (m1-m2)/Math.sqrt(v1/g1.length + v2/g2.length);

  document.getElementById("result").innerHTML =
    "t = " + t.toFixed(4);
}
</script>

</body>
</html>
