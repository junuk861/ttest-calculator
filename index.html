<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>t-test Calculator</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jstat/1.9.6/jstat.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #667085;
      --line: #d8dee8;
      --accent: #276ef1;
      --accent-dark: #174ea6;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(980px, calc(100% - 32px));
      margin: 28px auto 48px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      margin-bottom: 4px;
      font-size: clamp(1.7rem, 3vw, 2.3rem);
    }

    .nav-link {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 0.9fr);
      gap: 20px;
      align-items: start;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 10px 24px rgba(20, 30, 45, 0.05);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      font: inherit;
      background: #fff;
    }

    textarea {
      min-height: 88px;
      padding: 10px;
      resize: vertical;
    }

    select {
      min-height: 42px;
      padding: 8px 10px;
    }

    .field { margin-bottom: 16px; }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    button:hover { background: var(--accent-dark); }

    button.secondary {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }

    button.secondary:hover {
      border-color: var(--accent);
      color: var(--accent-dark);
      background: #eef4ff;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .message {
      display: none;
      margin-bottom: 16px;
      border: 1px solid #f5c2c0;
      border-radius: 6px;
      padding: 10px 12px;
      background: #fff3f2;
      color: var(--danger);
      font-weight: 700;
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }

    .result-table th,
    .result-table td {
      border-bottom: 1px solid var(--line);
      padding: 10px 8px;
      text-align: left;
      vertical-align: top;
    }

    .result-table th {
      color: var(--muted);
      font-size: 0.86rem;
      text-transform: uppercase;
    }

    .stars {
      display: inline-block;
      min-width: 42px;
      color: var(--accent-dark);
      font-weight: 800;
    }

    .chart-wrap {
      height: 320px;
      margin-top: 18px;
    }

    .empty {
      color: var(--muted);
      margin-bottom: 0;
    }

    @media (max-width: 760px) {
      header,
      .grid {
        display: block;
      }

      .nav-link {
        display: inline-block;
        margin-top: 8px;
      }

      section {
        margin-bottom: 16px;
        padding: 16px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .button-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div>
        <h1>t-test Calculator</h1>
        <p class="empty">Welch, equal-variance, and paired t-tests with directional p-values.</p>
      </div>
      <a class="nav-link" href="anova.html">Open ANOVA Calculator</a>
    </header>

    <div class="grid">
      <section>
        <h2>Input</h2>

        <div id="message" class="message"></div>

        <div class="field">
          <label for="g1">Group 1</label>
          <textarea id="g1" placeholder="Example: 4.2, 5.1, 5.5, 6.0"></textarea>
        </div>

        <div class="field">
          <label for="g2">Group 2</label>
          <textarea id="g2" placeholder="Example: 3.8, 4.0, 4.4, 5.2"></textarea>
        </div>

        <div class="controls">
          <div>
            <label for="testType">Test type</label>
            <select id="testType">
              <option value="welch">Unpaired Welch</option>
              <option value="student">Unpaired equal variance</option>
              <option value="paired">Paired</option>
            </select>
          </div>

          <div>
            <label for="tail">Alternative hypothesis</label>
            <select id="tail">
              <option value="two">Group 1 != Group 2</option>
              <option value="greater">Group 1 > Group 2</option>
              <option value="less">Group 1 < Group 2</option>
            </select>
          </div>
        </div>

        <div class="button-row">
          <button onclick="runTest()">Calculate</button>
          <button id="exportButton" class="secondary" onclick="exportExcel()" disabled>Export Excel</button>
        </div>
      </section>

      <section>
        <h2>Result</h2>
        <div id="result">
          <p class="empty">Enter two groups and calculate to see the summary.</p>
        </div>

        <div class="chart-wrap">
          <canvas id="plot"></canvas>
        </div>
      </section>
    </div>
  </main>

  <script>
    let latestTTestExport = null;

    function parseInput(str) {
      return str
        .split(/[\s,;]+/)
        .map(x => parseFloat(x.trim()))
        .filter(x => Number.isFinite(x));
    }

    function mean(a) {
      return a.reduce((x, y) => x + y, 0) / a.length;
    }

    function variance(a, m) {
      return a.reduce((x, y) => x + (y - m) ** 2, 0) / (a.length - 1);
    }

    function sem(a) {
      return Math.sqrt(variance(a, mean(a)) / a.length);
    }

    function showMessage(text) {
      const message = document.getElementById("message");
      message.textContent = text;
      message.style.display = text ? "block" : "none";
    }

    function starsForP(p) {
      if (p < 0.001) return "***";
      if (p < 0.01) return "**";
      if (p < 0.05) return "*";
      return "ns";
    }

    function formatP(p) {
      return p < 0.001 ? p.toExponential(3) : p.toFixed(4);
    }

    function pValueForTail(t, df, tail) {
      if (tail === "two") {
        return 2 * (1 - jStat.studentt.cdf(Math.abs(t), df));
      }

      if (tail === "greater") {
        return 1 - jStat.studentt.cdf(t, df);
      }

      return jStat.studentt.cdf(t, df);
    }

    function validateFiniteResult(t, df) {
      return Number.isFinite(t) && Number.isFinite(df) && df > 0;
    }

    function testTypeLabel(type) {
      if (type === "paired") return "Paired t-test";
      if (type === "student") return "Unpaired equal variance t-test";
      return "Unpaired Welch t-test";
    }

    function tailLabel(tail) {
      if (tail === "greater") return "Group 1 > Group 2";
      if (tail === "less") return "Group 1 < Group 2";
      return "Group 1 != Group 2";
    }

    function runTest() {
      showMessage("");

      const g1 = parseInput(document.getElementById("g1").value);
      const g2 = parseInput(document.getElementById("g2").value);

      if (g1.length < 2 || g2.length < 2) {
        showMessage("Each group needs at least 2 numeric values.");
        return;
      }

      const type = document.getElementById("testType").value;
      const tail = document.getElementById("tail").value;

      const m1 = mean(g1);
      const m2 = mean(g2);
      const v1 = variance(g1, m1);
      const v2 = variance(g2, m2);
      const n1 = g1.length;
      const n2 = g2.length;

      let t;
      let df;

      if (type === "paired") {
        if (g1.length !== g2.length) {
          showMessage("Paired t-test requires the same number of values in both groups.");
          return;
        }

        const diff = g1.map((x, i) => x - g2[i]);
        const md = mean(diff);
        const vd = variance(diff, md);
        t = md / Math.sqrt(vd / diff.length);
        df = diff.length - 1;
      } else if (type === "student") {
        const pooled = ((n1 - 1) * v1 + (n2 - 1) * v2) / (n1 + n2 - 2);
        t = (m1 - m2) / Math.sqrt(pooled * (1 / n1 + 1 / n2));
        df = n1 + n2 - 2;
      } else {
        const se2 = v1 / n1 + v2 / n2;
        t = (m1 - m2) / Math.sqrt(se2);
        df = se2 ** 2 / (((v1 / n1) ** 2 / (n1 - 1)) + ((v2 / n2) ** 2 / (n2 - 1)));
      }

      if (!validateFiniteResult(t, df)) {
        showMessage("The test could not be calculated. Check for identical values or too little variation.");
        return;
      }

      const p = Math.min(Math.max(pValueForTail(t, df, tail), 0), 1);
      const stars = starsForP(p);
      const sem1 = sem(g1);
      const sem2 = sem(g2);

      latestTTestExport = {
        summary: [
          ["Metric", "Value"],
          ["Test type", testTypeLabel(type)],
          ["Alternative hypothesis", tailLabel(tail)],
          ["Group 1 mean", m1],
          ["Group 1 SEM", sem1],
          ["Group 1 n", n1],
          ["Group 2 mean", m2],
          ["Group 2 SEM", sem2],
          ["Group 2 n", n2],
          ["t", t],
          ["df", df],
          ["p", p],
          ["Significance", stars]
        ],
        rawData: [
          ["Index", "Group 1", "Group 2"],
          ...Array.from({ length: Math.max(g1.length, g2.length) }, (_, i) => [
            i + 1,
            g1[i] ?? "",
            g2[i] ?? ""
          ])
        ]
      };

      document.getElementById("exportButton").disabled = false;

      document.getElementById("result").innerHTML = `
        <table class="result-table">
          <tr><th>Metric</th><th>Value</th></tr>
          <tr><td>Group 1</td><td>${m1.toFixed(3)} &plusmn; ${sem1.toFixed(3)} SEM, n = ${n1}</td></tr>
          <tr><td>Group 2</td><td>${m2.toFixed(3)} &plusmn; ${sem2.toFixed(3)} SEM, n = ${n2}</td></tr>
          <tr><td>t</td><td>${t.toFixed(3)}</td></tr>
          <tr><td>df</td><td>${df.toFixed(2)}</td></tr>
          <tr><td>p</td><td>${formatP(p)} <span class="stars">${stars}</span></td></tr>
        </table>
      `;

      drawPlot(g1, g2, m1, m2);
    }

    function exportExcel() {
      if (!latestTTestExport) {
        showMessage("Calculate first, then export the Excel file.");
        return;
      }

      if (typeof XLSX === "undefined") {
        showMessage("Excel export library is not loaded. Check your internet connection.");
        return;
      }

      const workbook = XLSX.utils.book_new();
      const summarySheet = XLSX.utils.aoa_to_sheet(latestTTestExport.summary);
      const rawSheet = XLSX.utils.aoa_to_sheet(latestTTestExport.rawData);

      XLSX.utils.book_append_sheet(workbook, summarySheet, "Summary");
      XLSX.utils.book_append_sheet(workbook, rawSheet, "Raw Data");
      XLSX.writeFile(workbook, "ttest_results.xlsx");
    }

    function jitter(index) {
      return ((index % 5) - 2) * 0.035;
    }

    function drawPlot(g1, g2, m1, m2) {
      const ctx = document.getElementById("plot").getContext("2d");

      if (window.chart) window.chart.destroy();

      window.chart = new Chart(ctx, {
        type: "scatter",
        data: {
          datasets: [
            {
              label: "Group 1 values",
              data: g1.map((y, i) => ({ x: 1 + jitter(i), y })),
              backgroundColor: "#276ef1"
            },
            {
              label: "Group 2 values",
              data: g2.map((y, i) => ({ x: 2 + jitter(i), y })),
              backgroundColor: "#d92d20"
            },
            {
              label: "Group means",
              data: [{ x: 1, y: m1 }, { x: 2, y: m2 }],
              type: "line",
              borderColor: "#17202a",
              backgroundColor: "#17202a",
              pointRadius: 7,
              pointStyle: "rectRounded",
              showLine: false
            }
          ]
        },
        options: {
          maintainAspectRatio: false,
          plugins: {
            legend: { position: "bottom" }
          },
          scales: {
            x: {
              min: 0.5,
              max: 2.5,
              ticks: {
                stepSize: 1,
                callback: value => value === 1 ? "Group 1" : value === 2 ? "Group 2" : ""
              }
            },
            y: {
              title: { display: true, text: "Value" }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
